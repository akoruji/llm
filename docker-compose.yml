services:
  vllm:
    image: vllm/vllm-openai
    command: --model Qwen/Qwen2.5-3B-Instruct
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=sk-no-key-needed
    volumes:
      - openwebui:/app/backend/data
    depends_on:
      - vllm

volumes:
  hf_cache:
  openwebui:
